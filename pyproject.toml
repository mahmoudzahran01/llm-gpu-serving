[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gpu-serving"
version = "0.1.0"
description = "Serving LLMs on GPUs: vLLM on Kubernetes with the NVIDIA device plugin, quantization and speculative-decoding benchmarks, and an OpenTelemetry/Prometheus/Grafana observability stack."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Mahmoud Zahran" }]
keywords = ["vllm", "kubernetes", "gpu", "quantization", "speculative-decoding", "observability", "opentelemetry", "llm-serving"]

# Core: the load-test client and workload builders (CPU only).
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# Instrumented demo service + load generator.
obs = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
]
# Merge + quantize (the published runs used the NGC PyTorch container; see docker/quant.Dockerfile).
quant = [
    "torch>=2.5",
    "transformers>=4.57",
    "peft>=0.17",
    "accelerate>=1.10",
    "datasets>=4.0",
    "llmcompressor>=0.8",
]
dev = ["llm-gpu-serving[obs]", "pytest>=8", "ruff>=0.6", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "obs", "k8s"]
extend-exclude = ["obs/grafana"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["llmserve"]

[tool.coverage.run]
source = ["llmserve"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
