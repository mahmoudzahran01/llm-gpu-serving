name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU only, no GPU, no model downloads)
        run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: pytest
        run: python -m pytest

  config-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: helm lint and render the vLLM chart
        run: |
          helm lint k8s/gpu/charts/vllm-gpu
          helm template vllm k8s/gpu/charts/vllm-gpu > /dev/null
      - name: promtool check rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/obs/prometheus/rules:/rules:ro" \
            prom/prometheus:v3.5.0 check rules /rules/alerts.yml /rules/recording.yml
