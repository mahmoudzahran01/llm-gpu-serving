apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
      httpMethod: POST
      exemplarTraceIdDestinations:          # metrics -> traces: the little dots on latency graphs
        - name: trace_id
          datasourceUid: tempo
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://localhost:3200
    jsonData:
      tracesToLogsV2:                        # traces -> logs
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        customQuery: true
        query: '{service_name="llm-gateway-demo"} |= "$${__trace.traceId}"'
      tracesToMetrics:                       # traces -> metrics
        datasourceUid: prometheus
        queries:
          - name: Request rate
            query: 'sum(rate(traces_span_metrics_calls_total{$$__tags}[1m]))'
      serviceMap: {datasourceUid: prometheus}
      nodeGraph: {enabled: true}
      search: {hide: false}
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://localhost:3100
    jsonData:
      derivedFields:                         # logs -> traces: clickable trace_id in log lines
        - name: trace_id
          datasourceUid: tempo
          matcherRegex: '"trace_id":\s*"(\w+)"'
          url: '$${__value.raw}'
          urlDisplayLabel: Open trace
